appId: com.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!node_modules/**"
extraResources:
  - from: DeepSeek-Harness-Dist
    to: DeepSeek-Harness-Dist
    filter:
      - "**/*"
  - from: DeepSeek-Harness-Dist/node_modules
    to: DeepSeek-Harness-Dist/node_modules
    filter:
      - "**/*"
asar:
  smartUnpack: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - arm64
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
