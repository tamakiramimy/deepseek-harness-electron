appId: com.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
artifactName: "${productName}-${version}-${platform}-${arch}.${ext}"
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!node_modules/**"
asar:
  smartUnpack: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - arm64
        - x64
