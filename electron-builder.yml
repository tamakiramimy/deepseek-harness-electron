appId: com.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - resources/harness/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
