name: Package Desktop Installers

on:
  workflow_dispatch:
    inputs:
      harness_version:
        description: Official @deepseek-ai/dsh version or npm tag for DeepSeek-Harness-Dist
        required: false
        default: latest
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            command: package:mac:arm64
            artifact: macos-arm64
          - name: macOS x64
            runner: macos-15-intel
            command: package:mac:x64
            artifact: macos-x64
          - name: Windows x64
            runner: windows-2025
            command: package:win:x64
            artifact: windows-x64
          - name: Windows arm64
            runner: windows-11-arm
            command: package:win:arm64
            artifact: windows-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            command: package:linux
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Electron shell dependencies
        run: pnpm install --prod=false --frozen-lockfile
      - name: Create and smoke test external Harness runtime
        env:
          DEEPSEEK_HARNESS_VERSION: ${{ inputs.harness_version || 'latest' }}
        run: |
          pnpm harness:dist:install
          pnpm harness:dist:validate
          pnpm harness:dist:smoke
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm ${{ matrix.command }}
      - name: Write checksums
        run: pnpm release:manifest
      - uses: actions/upload-artifact@v7
        with:
          name: DeepSeek-Harness-Desktop-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30