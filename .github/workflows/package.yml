name: Package Desktop Release

on:
  workflow_dispatch:
    inputs:
      harness_version:
        description: Official @deepseek-ai/dsh version or npm tag embedded in each desktop package
        required: false
        default: 0.1.1-rc.2
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    needs: runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            command: package:mac:arm64
            target: darwin-arm64
            artifact: desktop-darwin-arm64
            installer_glob: release/*.dmg
          - name: macOS x64
            runner: macos-15-intel
            command: package:mac:x64
            target: darwin-x64
            artifact: desktop-darwin-x64
            installer_glob: release/*.dmg
          - name: Windows arm64
            runner: windows-11-arm
            command: package:win:arm64
            target: win32-arm64
            artifact: desktop-win32-arm64
            installer_glob: release/*.exe
          - name: Windows x64
            runner: windows-2025
            command: package:win:x64
            target: win32-x64
            artifact: desktop-win32-x64
            installer_glob: release/*.exe

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v7
        with:
          name: runtime-package-${{ matrix.target }}
          path: runtime-package
      - name: Install desktop build dependencies
        run: pnpm install --prod=false --frozen-lockfile
      - name: Build self-contained desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_PUBLISH: never
        run: pnpm ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer_glob }}
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Runtime ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: darwin-arm64
          - name: macOS x64
            runner: macos-15-intel
            target: darwin-x64
          - name: Windows arm64
            runner: windows-11-arm
            target: win32-arm64
          - name: Windows x64
            runner: windows-2025
            target: win32-x64

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Runtime build tools
        run: pnpm install --prod=false --frozen-lockfile
      - name: Create and smoke test platform Runtime Dist
        env:
          DEEPSEEK_HARNESS_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.harness_version || '0.1.1-rc.2' }}
          DEEPSEEK_HARNESS_DIST: runtime-output/DeepSeek-Harness-Dist/${{ matrix.target }}
          DEEPSEEK_HARNESS_TARGET: ${{ matrix.target }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          pnpm harness:dist:install
          pnpm harness:dist:validate
          pnpm harness:dist:smoke
      - name: Archive platform Runtime for its desktop package
        env:
          DEEPSEEK_HARNESS_DIST: runtime-output/DeepSeek-Harness-Dist/${{ matrix.target }}
          DEEPSEEK_HARNESS_PACKAGE: runtime-package
        run: pnpm harness:dist:archive
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-package-${{ matrix.target }}
          path: runtime-package
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: desktop-darwin-arm64
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: desktop-darwin-x64
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: desktop-win32-arm64
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: desktop-win32-x64
          path: release-assets
      - name: Create release with self-contained desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --repo "${GITHUB_REPOSITORY}"